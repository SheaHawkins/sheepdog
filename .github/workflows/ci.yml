name: CI

# Builds and tests sheepdog on macOS, Linux and Windows, cross-compiles the
# release targets, and checks that herdr itself runs headless on each OS.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The race detector needs cgo, and Windows runners have no C compiler
      # set up for it.
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
              -o "dist/sheepdog-$os-$arch$ext" ./cmd/sheepdog
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: sheepdog-binaries
          path: dist/
          retention-days: 14

  herdr:
    name: herdr headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install herdr (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install herdr (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://herdr.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\Herdr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Start a server, open a pane, run a command in it
        shell: bash
        run: |
          herdr --version
          herdr --session ci server > server.log 2>&1 &
          for i in $(seq 1 60); do
            herdr --session ci status server > /dev/null 2>&1 && break
            sleep 1
          done
          herdr --session ci status server
          pane=$(herdr --session ci workspace create --cwd "$PWD" --label ci --no-focus | jq -r .result.root_pane.pane_id)
          echo "pane: $pane"
          herdr --session ci pane run "$pane" "echo sheepdog-ci-ok"
          # Anchored, so the echoed command line does not count.
          herdr --session ci pane wait-output "$pane" --regex '(?m)^sheepdog-ci-ok\s*$' --timeout 30000 > /dev/null
          echo "pane output:"
          herdr --session ci pane read "$pane" --source recent
          herdr --session ci server stop
      - name: herdr server log
        if: failure()
        shell: bash
        run: cat server.log || true

  plugin:
    name: herdr plugin (${{ matrix.os }})
    # Links a minimal plugin whose commands run bin/sheepdog, then checks that
    # herdr launches it from the plugin directory (bin\sheepdog.exe on
    # Windows) for a startup hook and an action, and what it passes in.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install herdr (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install herdr (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://herdr.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\Programs\Herdr\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Link the plugin, start herdr, invoke an action
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p "$RUNNER_TEMP/plugin/bin"
          cp cmd/sheepdog/testdata/plugin/herdr-plugin.toml "$RUNNER_TEMP/plugin/"
          go build -o "$RUNNER_TEMP/plugin/bin/sheepdog$ext" ./cmd/sheepdog
          # Linked before the server starts, so its startup hook runs. This
          # is the default session, which checks HERDR_SESSION there too.
          herdr plugin link "$RUNNER_TEMP/plugin"
          herdr server > server.log 2>&1 &
          for i in $(seq 1 60); do herdr status server > /dev/null 2>&1 && break; sleep 1; done
          herdr workspace create --cwd "$PWD" --label ci --no-focus > /dev/null
          herdr plugin action invoke sheepdog-ci.doctor > /dev/null
          for i in $(seq 1 30); do
            herdr plugin log list --plugin sheepdog-ci > logs.json
            [ "$(jq '[.result.logs[] | select(.status != "running")] | length' logs.json)" -ge 2 ] && break
            sleep 1
          done
          jq -r '.result.logs[] | "== \(.event // "action") \(.command | join(" ")): \(.status) (exit \(.exit_code))\n\(.stdout)\(.stderr)"' logs.json
          # Both ran, exited 0 and printed what herdr passed in.
          jq -e '[.result.logs[] | select(.status == "succeeded" and .exit_code == 0)] | length == 2' logs.json
          jq -e '[.result.logs[].stdout | fromjson | .plugin_root != ""] | all' logs.json
          herdr server stop
      - name: herdr server log
        if: failure()
        shell: bash
        run: cat server.log || true
